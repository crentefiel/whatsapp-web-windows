name: Testes da base WhatsApp
on:
  push:
    branches: [main, 'feat/baileys-client-foundation', 'feat/observation-learning-memory']
  pull_request:
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências do projeto
        run: npm install --no-audit --no-fund
      - name: Verificar sintaxe
        run: npm run check
      - name: Testar código, mensagens e SQLite
        run: npm test
