<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aprendizado da IA — Gráfica do Sorriso</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #111b21; color: #e9edef; }
    header { background: #202c33; padding: 16px 20px; border-bottom: 1px solid #2a3942; }
    h1 { margin: 0; font-size: 18px; }
    .stats { font-size: 13px; color: #8696a0; margin-top: 6px; }
    .controls { padding: 12px 20px; background: #202c33; }
    button { background: #00a884; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin-right: 8px; }
    button.secondary { background: #2a3942; }
    .list { padding: 16px 20px; max-height: calc(100vh - 140px); overflow-y: auto; }
    .example { background: #202c33; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; border-left: 3px solid #00a884; }
    .incoming { color: #d1d7db; font-size: 14px; }
    .reply { color: #00a884; margin-top: 6px; font-size: 14px; }
    .meta { font-size: 11px; color: #8696a0; margin-top: 6px; }
    .empty { text-align: center; color: #8696a0; padding: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>Aprendizado da IA</h1>
    <div class="stats" id="stats">Carregando...</div>
  </header>
  <div class="controls">
    <button onclick="refresh()">Atualizar</button>
    <button class="secondary" onclick="window.close()">Fechar</button>
  </div>
  <div class="list" id="list">
    <div class="empty">Carregando exemplos...</div>
  </div>

  <script>
    async function refresh() {
      try {
        const data = await window.learningAPI.getData();
        document.getElementById('stats').textContent =
          `Modo atual: ${data.mode} · ${data.stats.totalExamples || 0} exemplos · Última atualização: ${data.stats.lastUpdated || 'nunca'}`;

        const list = document.getElementById('list');
        if (!data.examples.length) {
          list.innerHTML = '<div class="empty">Nenhum exemplo ainda.<br>Responda mensagens no WhatsApp para a IA aprender.</div>';
          return;
        }

        list.innerHTML = data.examples.map(ex => `
          <div class="example">
            <div class="incoming"><strong>Recebida:</strong> ${escapeHtml(ex.incomingText)}</div>
            <div class="reply"><strong>Sua resposta:</strong> ${escapeHtml(ex.userReply)}</div>
            <div class="meta">${ex.chatName || 'Chat'} · ${new Date(ex.timestamp).toLocaleString('pt-BR')}</div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('list').innerHTML = '<div class="empty">Erro ao carregar: ' + e.message + '</div>';
      }
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
    }

    refresh();
  </script>
</body>
</html>
